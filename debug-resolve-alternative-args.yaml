session:
  id: bug-2026-08-02-resolve-alternative-args
  summary: "resolve-alternative called with wrong number of arguments from resolve-deps"
  started: 2026-08-02T23:28:00

  target_behavior: >
    resolve-dependencies returns :successful results for valid inputs,
    and resolve-alternative receives all required arguments (conflict-strat,
    concat-reqs, safe-spec-call, cull, cull-alternatives, mkerror, resolve-deps)
    via closure capture rather than explicit threading.
  done_when: >
    (resolve-dependencies (list (present "b" (list (list (make-version-predicate :relation :greater-than :version "2.0.0"))))) query :compare #'maven-vercmp) returns (:successful ...) with no invalid-number-of-arguments error.

steps:

  understand_system:
    work:
      findings:
        - "Clojure make-resolve-deps creates a closure (resolve-deps) capturing conflict-strat, concat-reqs, safe-spec-call, cull, cull-alternatives; try-alternative is defined inline as a lambda inside resolve-deps, giving it closure access to both strategy and runtime args."
        - "Lisp port extracts resolve-alternative as a top-level function with 13 explicit params, but make-resolve-deps only passes 6 args to resolve-deps, and resolve-deps only passes 8 args to resolve-alternative — both missing the strategy/thunking arguments."
        - "The Clojure first-found utility short-circuits on first success; the Lisp port's loop+some approach collects all results then checks — functionally equivalent but the threading gap causes invalid-number-of-arguments: 8 errors."
      theories:
        - "Restructuring resolve-alternative as a labels function inside make-resolve-deps's closure will fix the argument mismatch by using closure capture, matching the Clojure pattern exactly."
      disproved: []

  make_it_fail:
    work:
      findings:
        - "Previous attempt: (resolve-dependencies (list (present \"b\" (list (list (make-version-predicate :relation :greater-than :version \"2.0.0\"))))) query :compare #'maven-vercmp) produced 'invalid number of arguments: 8' error from resolve-alternative."
        - "The error message confirms resolve-deps only passes 8 args to resolve-alternative while it expects 13."
      theories:
        - "Restructuring resolve-alternative as a labels function inside make-resolve-deps's closure will fix the argument count by using closure capture instead of explicit threading."
      disproved: []

  quit_guessing_look:
    work:
      findings: []
      theories: []
      disproved: []

  divide_and_conquer:
    work:
      findings: []
      theories: []
      disproved: []

  change_one_thing:
    work:
      findings:
        - "Fixed make-comparison :in-range capture groups: re-num now reads from groups[2], higher-version uses groups[1] (rest) + incremented num, not groups[0]"
        - "Fixed make-spec-call: added nil-cmp guard returning t (matching Clojure's nil-safe-spec-call behavior)"
        - "Fixed try-candidates: replaced multiple-value-bind with first/second destructuring, added suggestion-based reordering of remaining candidates"
        - "Restructured resolve-deps/make-resolve-deps/resolve-alternative into closure pattern: make-resolve-deps returns lambda that defines resolve-deps and resolve-alternative as labels, capturing strategy args by closure (matching Clojure's try-alternative pattern)"
        - "Fixed resolve-dependencies-deluxe: requirements now treated as list of clauses (not list of alternatives), matching Clojure's (map #(->DecoratedRequirement % :root) requirements) pattern"
        - "Fixed resolve-alternative :present sub-dependency creation: uses clause directly (not wrapped in list) matching Clojure's (map #(->DecoratedRequirement % candidate) (:requirements candidate))"
        - "Removed orphaned leftover code from old resolve-alternative that was left behind during edit"
      theories:
        - "The closure pattern fix resolves the 'invalid number of arguments: 8' error since resolve-alternative no longer requires explicit argument threading"
      disproved: []

