GOOSE_ROUTER_TOOL_SELECTION_STRATEGY: default
GOOSE_MODE: auto
GOOSE_SCHEDULER_TYPE: legacy
ANTHROPIC_HOST: https://api.anthropic.com
GOOSE_CLI_MIN_PRIORITY: 0.0
GOOSE_MAX_TURNS: 100
GOOSE_CLI_THEME: dark
OLLAMA_HOST: localhost
extensions:
  computercontroller:
    enabled: false
    type: builtin
    name: computercontroller
    description: ''
    display_name: Computer Controller
    timeout: 300
    bundled: true
  desktop-commander:
    enabled: false
    type: stdio
    name: desktop-commander
    description: ''
    cmd: npx
    args:
    - -y
    - '@wonderwhy-er/desktop-commander'
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  developer:
    enabled: true
    type: builtin
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    timeout: null
    bundled: true
  filesystem:
    enabled: true
    type: stdio
    name: filesystem
    description: |
      This extension provides access to the filesystem, in particular files
      under the home user directory. It is intended as the main plugin through
      which to interact with files, with the exception of making and reading
      temporary files. These temporary files should be dealt with using the
      `tmp-files` extension.
    cmd: npx
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - /home/skin
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  git:
    enabled: true
    type: stdio
    name: git
    description: ''
    cmd: uvx
    args:
    - mcp-server-git
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  goose-docs:
    enabled: true
    type: stdio
    name: goose-docs
    description: ''
    cmd: npx
    args:
    - mcp-remote
    - https://block.gitmcp.io/goose/
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  jsondiffpatch:
    enabled: true
    type: stdio
    name: jsondiffpatch
    description: Compare text or JSON data and get a readable diff.
    cmd: npx
    args:
    - -y
    - diff-mcp
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  pdf:
    enabled: true
    type: stdio
    name: pdf
    description: ''
    cmd: uvx
    args:
    - mcp-read-pdf
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  sequential-thinking:
    enabled: true
    type: stdio
    name: sequential-thinking
    description: ''
    cmd: npx
    args:
    - -y
    - '@modelcontextprotocol/server-sequential-thinking'
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
GOOSE_TELEMETRY_ENABLED: true
providers:
  openrouter:
    enabled: true
    model: mistralai/mistral-saba
    configured: true
active_provider: openrouter
